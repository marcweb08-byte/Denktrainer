<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: http:; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f4fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Denktraining</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f5f7,#0f1318);--card:light-dark(#fff,#181e26);--ink:light-dark(#121820,#e8ecf1);--mut:light-dark(#5d6775,#95a0ae);--line:light-dark(#dde1e7,#28313c);--acc:#1f4fa8;--acc2:light-dark(#1f4fa8,#6f9cf0);--soft:light-dark(#eef3fc,#1a2536);--ok:#1d8a52;--mid:#c28a10;--bad:#c23b2b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--acc);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 18px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:720px;margin:0 auto}
header h1{margin:0;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.01em}
header p{margin:4px auto 0;opacity:.85;font-size:14px;max-width:720px}
header .gear{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);font-size:14px;min-height:38px;padding:0 12px}
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin:10px auto 0;max-width:720px}
.prog i{display:block;height:100%;background:#fff}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.lesson{border-color:var(--acc2);border-width:2px}
.kat{font-size:13px;color:var(--acc2);font-weight:700}
h2{font-size:20px;margin:2px 0 8px;line-height:1.2}
h3{font-size:16px;margin:14px 0 4px}
.txt{white-space:pre-wrap}
textarea,input,select{width:100%;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:130px;resize:vertical}
button{font:600 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>button{flex:1 1 auto}
.mut{color:var(--mut);font-size:14px}
.tip{background:var(--soft);border-radius:10px;padding:10px;margin-top:10px;font-size:15px}
.score{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.score b{font-size:34px;line-height:1}
.fb{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
ul{margin:4px 0;padding-left:20px}
details summary{cursor:pointer;font-weight:600;min-height:34px;padding-top:6px}
.done{opacity:.8}
nav{position:fixed;inset:auto 0 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{border:0;border-radius:0;background:none;font-size:13px;min-height:58px;color:var(--mut);padding:0 4px}
nav button.on{color:var(--acc2);box-shadow:inset 0 3px var(--acc2)}
.bar{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3.2em;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bar div{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar div i{display:block;height:100%;background:var(--acc2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stats b{display:block;font-size:26px;line-height:1.1}
.stats span{font-size:12px;color:var(--mut)}
.big{font-size:clamp(30px,9vw,52px);font-weight:800;text-align:center;line-height:1.1;margin:22px 0;overflow-wrap:anywhere}
.timer{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--acc2)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.chk{display:flex;align-items:center;gap:10px;font-weight:400;font-size:16px;margin:6px 0}
.chk input{width:22px;height:22px}
.err{color:var(--bad);font-size:14px;margin-top:8px;white-space:pre-wrap}
.okm{color:var(--ok);font-size:14px;margin-top:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:14px}
.seg button{padding:0 6px;font-size:15px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;max-width:92%}
.msg.u{background:var(--acc);color:#fff;margin-left:auto}
.msg.a{background:var(--card);border:1px solid var(--line)}
.ctx{font-size:13px;background:var(--soft);border-radius:8px;padding:8px;margin-bottom:8px}
.erl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.erl s{color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes r{to{transform:rotate(1turn)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
body.locked nav,body.locked .gear{display:none}
</style>
</head>
<body>
<header><div class="hrow"><h1 id="ht">Heute</h1><button class="gear" data-go="setup">Einstellungen</button></div><p id="hs"></p><div class="prog" id="hp" hidden><i></i></div></header>
<main id="v"></main>
<nav>
<button data-v="heute" class="on">Heute</button>
<button data-v="plan">Plan</button>
<button data-v="coach">Coach</button>
<button data-v="sport">Sport</button>
<button data-v="stand">Stand</button>
</nav>
<script>
{
/* ================= Inhalte ================= */
const CATS={
wort:{n:'Wortschatz',w:1,d:'Ein anspruchsvolles, bildungssprachliches deutsches Wort (Niveau wie "eloquent", "lakonisch", "ambivalent", "prägnant", "opportun"), das man im Alltag wirklich einsetzen kann. Der Nutzer nennt die vermutete Bedeutung UND bildet einen eigenen, natürlichen Satz aus seinem Alltag. Fülle "wort" und "bedeutung" (Definition, Herkunft in einem Halbsatz, ein Beispielsatz). Die Bedeutung darf NICHT in "aufgabe" stehen.'},
smalltalk:{n:'Smalltalk',w:1.4,d:'Konkrete Smalltalk-Situation (Party, Kunde, Training, Uni, Betrieb, Fremder in der Bahn, Familienfeier) mit Details über die andere Person und die Umgebung. Der Nutzer schreibt seine ersten 3 bis 4 Gesprächsbeiträge wörtlich: Einstieg, Anknüpfungspunkte nutzen, gute Fragen, etwas von sich erzählen, Gespräch vertiefen oder elegant beenden.'},
ordnen:{n:'Gedanken ordnen',w:1.3,d:'Entweder: ein unstrukturiertes, realistisches Problem mit durcheinander erzählten Details, das der Nutzer präzise und gut formuliert zusammenfasst (Kernproblem, Ursachen, Optionen, Entscheidung mit Begründung, max. 6 Sätze). Oder: ein vages Ziel, für das der Nutzer einen präzisen, strukturierten Prompt für eine KI schreibt.'},
alltag:{n:'Alltag & Reaktion',w:1.3,d:'Realistische, unangenehme Alltagssituation (Stress, Ärger, unfaire Kritik, Grenzen setzen, Konflikt in Team, Familie, Training oder mit Kunden). Der Nutzer schreibt wörtlich, was er sagt und tut, und warum.'},
argument:{n:'Überzeugen',w:1.2,d:'Der Nutzer soll eine konkret beschriebene Person mit eigenen Interessen und Einwänden von etwas überzeugen oder eine Position verteidigen, manchmal eine, die er vermutlich nicht teilt.'},
logik:{n:'Logik & Technik',w:1.2,d:'Offenes Denkproblem aus Mathe, Physik oder Mechatronik mit Praxisbezug (Hebel, Getriebe, Reibung, Energie, Schwingung, Sensorik, Regelung, Abschätzungen). Nicht nur Formel einsetzen: Der Nutzer muss den Ansatz selbst finden und Rechenweg und Begründung zeigen.'},
kunst:{n:'Kunstgriffe erkennen',w:1.1,d:'Ein realistischer Dialog (Diskussion, Verkauf, Streit, Verhandlung, Politik, Social Media), in dem eine Person 1 bis 3 rhetorische Kunstgriffe, Fehlschlüsse, Manipulations- oder Verhandlungstechniken (aus allen Quellen, nicht nur Schopenhauer) subtil einsetzt. NICHT benennen. Der Nutzer erkennt sie, erklärt ihre Wirkung und formuliert wörtlich einen Konter.'},
sprache:{n:'Rechtschreibung & Stil',w:1.1,d:'Ein kurzer Text (3 bis 5 Sätze) mit Rechtschreib-, Grammatik-, Komma- und Stilfehlern. Den fehlerhaften Text vollständig in "aufgabe" schreiben. Der Nutzer schreibt ihn korrekt und stilistisch besser neu.'},
psycho:{n:'Menschen lesen',w:1,d:'Beschreibe eine konkrete Person in einer Situation mit Verhalten, Worten, Körpersprache und Kontext, inklusive unscheinbarer Details. Der Nutzer erstellt ein Profil: Motive, Bedürfnisse, wahrscheinliche Persönlichkeit, welche Indizien worauf hindeuten, wie man am besten mit ihr umgeht.'},
fall:{n:'Fall lösen',w:.9,d:'Kurzer, eindeutig lösbarer Rätselfall (Alltag oder Krimi) mit mehreren Indizien, auch unscheinbaren. Der Nutzer erkennt das Gesamtbild, leitet die Lösung her und begründet die Indizienkette.'},
wissen:{n:'Wissen & Zusammenhänge',w:.9,d:'Eine anspruchsvolle Warum- oder Wie-Frage mit Tiefe (Geschichte, Wirtschaft, Recht, Naturwissenschaft, Technik, Gesellschaft, Psychologie). Kein Quiz-Fakt: Der Nutzer erklärt Zusammenhänge oder leitet sie her.'},
praxis:{n:'Praxis & Test',w:.8,d:'Aufgabe wie aus Einstellungstests, aber mit echtem Lebensnutzen: Kopfrechnen, Prozente, Zinsen, Kleingedrucktes in Verträgen, Zeit- und Budgetplanung, Fermi-Schätzung, Daten deuten. Der Nutzer zeigt den Rechen- oder Denkweg.'},
fremd:{n:'Fremdsprache',w:.8,d:'Kurze Aufgabe in der Fremdsprache: realistische Nachricht beantworten, Situation beschreiben oder etwas idiomatisch übersetzen. Aufgabe in der Fremdsprache stellen.'},
technik:{n:'Technik anwenden',x:1},debatte:{n:'Debatte',x:1}
};
const DAILY=Object.keys(CATS).filter(k=>!CATS[k].x);
const MOD={
eristik:{n:'Kunstgriffe: Schopenhauer',l:['Die Erweiterung','Die Homonymie','Relativ Gesagtes absolut nehmen','Prämissen verdeckt vorbereiten','Falsche Prämissen nutzen','Verdeckte Petitio principii','Viele Fragen auf einmal','Den Gegner zornig machen','Fragen in verwürfelter Ordnung','Das Gegenteil fragen','Induktion durch Einzelzugeständnisse','Gleichnisse und Namen günstig wählen','Den Gegensatz grell machen','Triumph ausrufen trotz Niederlage','Den paradoxen Satz unterschieben','Argumentum ad hominem ex concessis','Die feine Unterscheidung','Den Gang der Debatte unterbrechen','Ins Allgemeine ausweichen','Den Schluss selbst ziehen','Scheinargument mit Scheinargument','Petitio principii vorwerfen','Zur Übertreibung reizen','Konsequenzmacherei','Die Instanz (Gegenbeispiel)','Retorsio argumenti (Umkehrung)','Nachhaken, wo der Gegner bös wird','Argumentum ad auditores','Die Diversion','Argumentum ad verecundiam (Autorität)','Ironische Inkompetenz','Verhasste Kategorie zuordnen','In der Theorie richtig, in der Praxis falsch','Bei Ausweichen nachbohren','Den Willen statt den Verstand ansprechen','Mit Wortschwall verblüffen','Schlechten Beweis widerlegen, Sache für widerlegt erklären','Persönlich werden (und das Gegenmittel)']},
rhetorik:{n:'Fehlschlüsse & Manipulation',l:['Strohmann','Steelmanning als Gegenmittel','Falsches Dilemma','Dammbruchargument','Whataboutism und Tu quoque','Gish-Galopp','Motte-and-Bailey','Torpfosten verschieben','Suggestivfragen und Fangfragen','Framing','Ankereffekt','Foot-in-the-door','Door-in-the-face','Reziprozität als Hebel','Künstliche Knappheit','Social Proof','Autorität und Uniform','Liebesbombe und Schmeichelei','Gaslighting erkennen','Korrelation ist nicht Kausalität','Survivorship Bias','Bestätigungsfehler','Schweigen und Pausen als Waffe','Gegenfrage statt Antwort','Sokratisches Fragen']},
denken:{n:'Problemlösen & Denkwerkzeuge',l:['Pólya: Verstehen, Planen, Ausführen, Prüfen','First-Principles-Denken','Inversion (vom Ziel rückwärts und vom Scheitern her)','Dimensionsanalyse','Grenzfälle und Extremwerte prüfen','Invarianten finden','Symmetrie ausnutzen','Problem vereinfachen, dann verallgemeinern','Fermi-Schätzung','MECE-Zerlegung','5 Warum','TRIZ: Widerspruch auflösen','Ishikawa-Diagramm im Kopf','Pre-Mortem','Bayes-Denken','Denken zweiter Ordnung','Erwartungswert und Opportunitätskosten','Analogien aus anderen Fachgebieten','Ockhams Rasiermesser richtig nutzen','Hypothese, Test, Widerlegung']},
psy:{n:'Smalltalk, Menschen & Gesprächsführung',l:['Baseline und Abweichung','Big Five im Verhalten erkennen','Bedürfnisse hinter Positionen (GFK)','Grenzen der Körpersprache-Deutung','Spiegeln (Chris Voss)','Labeling von Gefühlen','Kalibrierte Fragen','Accusation Audit','Ein Nein provozieren','Grenzen setzen: Broken Record','Fogging bei Kritik','Ich-Botschaften ohne Weichspüler','Smalltalk: FORD und Faden aufnehmen','Status und Körperhaltung','De-Eskalation','Unter Stress klar bleiben: Atmung und Benennen','Reframing','Lob und Kritik richtig dosieren','Zuhören auf drei Ebenen','Kalte Deduktion: von Details zu Schlüssen, mit Wahrscheinlichkeiten','Smalltalk-Einstieg ohne Floskel','Anknüpfungspunkte und Gesprächsfäden','Geschichten erzählen, die hängen bleiben','Humor und Leichtigkeit','Gespräche elegant beenden','Namen merken und nutzen','Der erste Eindruck in 30 Sekunden','Gruppengespräche: einsteigen und gehört werden']},
ausdruck:{n:'Struktur & Ausdruck',l:['Pyramidenprinzip (Minto)','SCQA-Einstieg','BLUF: Kernaussage zuerst','PREP-Argument','Prompt-Struktur: Rolle, Ziel, Kontext, Format, Kriterien, Beispiele','Präzise Verben statt Nominalstil','Streichen: jedes Wort muss arbeiten','Dreierregel und Rhythmus','Konkret statt abstrakt','Kommaregeln, die jeder falsch macht','das oder dass, seit oder seid und Co.','Konjunktiv I und II sicher','Fremdwörter korrekt einsetzen','Übergänge, die Logik zeigen','Starke Einstiege und Schlüsse','Schlagfertigkeit','Klar sprechen statt Füllwörter','Erklären auf drei Niveaus']},
lernen:{n:'Lernen & Gedächtnis',l:['Feynman-Methode','Abrufen statt Wiederlesen','Spaced Repetition','Interleaving','Elaboration: Warum-Fragen','Gedächtnispalast (Loci)','Major-System für Zahlen','Chunking','Fehlerjournal','Wissen übertragen (Transfer)']}
};
const PRIO='Priorität nach Alltagsnutzen: 1. Smalltalk und souveränes Gesprächsverhalten, 2. sich präzise, geordnet und schön ausdrücken, 3. klar denken und Probleme lösen, 4. überzeugen, argumentieren, Kunstgriffe erkennen und kontern, danach der Rest.';
const PRESETS={groq:{base:'https://api.groq.com/openai/v1',model:'openai/gpt-oss-120b'},gemini:{base:'https://generativelanguage.googleapis.com/v1beta/openai',model:'gemini-flash-lite-latest'},openrouter:{base:'https://openrouter.ai/api/v1',model:'openai/gpt-oss-120b:free'},eigen:{base:'',model:''}};
const GOALS='Logischer denken (Mathe, Physik, Mechatronik) und bei jedem Problem sehr gute Lösungsansätze finden. Smalltalk sicher beherrschen. Gedanken geordnet, präzise und schön ausdrücken, auch Prompts. In Alltagssituationen (Stress, Ärger) souverän reagieren. Argumentieren, überzeugen, Diskussionen gewinnen, Rhetorische Kunstgriffe, Fehlschlüsse und Manipulation (z. B. Schopenhauer, aber nicht nur) erkennen, kontern und selbst beherrschen. Menschen analysieren, Profile erstellen, Fälle lösen, das Gesamtbild sehen. Rechtschreibung, Fremdsprache, Allgemeinwissen, Einstellungstests. Nicht nur Oberfläche, sondern Fortgeschrittenes, das die wenigsten können, und es wirklich anwenden können.';
const DEF={set:{prov:'groq',base:PRESETS.groq.base,model:PRESETS.groq.model,key:'',min:20,words:1,lang:'Englisch',name:'Marc',about:'18 Jahre, duales Maschinenbau-Studium, Freelance-Webentwickler, Ju-Jutsu-Trainerassistent.',cats:Object.fromEntries(DAILY.map(k=>[k,true]))},goals:GOALS,days:{},res:[],words:[],lvl:{},ana:null,plan:null,tech:{},techN:0,chat:[],deb:null,ctx:null,profil:'',err:{},tut:null,topics:{},lastCycle:'',paths:[]};

/* ================= Speicher & Verschlüsselung ================= */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function merge(L){const s=Object.assign(structuredClone(DEF),L||{});s.set=Object.assign(structuredClone(DEF.set),L?.set);s.set.cats=Object.assign(structuredClone(DEF.set.cats),L?.set?.cats);if(!PRESETS[s.set.prov])s.set.prov='eigen';return s}
let S=structuredClone(DEF),K=null,SALT=null,locked=false,st=null,hiddenAt=0;
async function saveNow(){
  if(locked)return;
  try{
    const json=JSON.stringify(S);
    if(K){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},K,enc.encode(json));localStorage.setItem('dtx',JSON.stringify({v:1,salt:b64(SALT),iv:b64(iv),data:b64(ct)}));localStorage.removeItem('dt')}
    else{localStorage.setItem('dt',json);localStorage.removeItem('dtx')}
  }catch(e){}
}
const save=()=>{clearTimeout(st);st=setTimeout(saveNow,300)};
try{if(localStorage.getItem('dtx'))locked=true;else{const L=JSON.parse(localStorage.getItem('dt')||'{}');if(L.set&&L.set.model==='gemini-flash-latest'){L.set.model='gemini-flash-lite-latest';localStorage.setItem('dt',JSON.stringify(L))}}if(locked);else S=merge(JSON.parse(localStorage.getItem('dt')||'{}'))}catch(e){S=structuredClone(DEF)}
async function unlock(pass){
  const o=JSON.parse(localStorage.getItem('dtx'));const salt=unb64(o.salt);const k=await derive(pass,salt);
  let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.data))}catch(e){throw new Error('Falsches Passwort.')}
  S=merge(JSON.parse(dec.decode(plain)));K=k;SALT=salt;locked=false;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();clearTimeout(st);saveNow()}else if(K&&hiddenAt&&Date.now()-hiddenAt>5*60e3)location.reload()});

/* ================= Helfer ================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const addDays=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const lvl=k=>S.lvl[k]??2;
const $=id=>document.getElementById(id);
const li=a=>Array.isArray(a)&&a.length?`<ul>${a.map(x=>`<li>${esc(typeof x==='object'?Object.values(x).join(' · '):x)}</li>`).join('')}</ul>`:'';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let view=locked?'lock':'heute',busy={},coachMode='frage';
let canStore=true;try{localStorage.setItem('dt_t','1');localStorage.removeItem('dt_t')}catch(e){canStore=false}
const storeWarn=()=>canStore?'':`<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">Speichern ist blockiert.</b><p>Dein Browser lässt die App nichts speichern: Key, Lernpfade und Ergebnisse gehen beim Schließen verloren. Ursache: privater Modus oder „Alle Cookies blockieren“ (iPhone-Einstellungen → Apps → Safari). Ausschalten und die App neu öffnen.</p></div>`;
const topErr=n=>Object.entries(S.err).filter(([,e])=>!e.done).sort((a,b)=>b[1].n/(1+daysBetween(b[1].last,today())/14)-a[1].n/(1+daysBetween(a[1].last,today())/14)).slice(0,n);
const modName=x=>x.mod==='pfad'?'LERNPFAD: '+(S.paths.find(p=>p.id===x.pfad)?.titel||'Ziel'):(MOD[x.mod]?.n||'');
const planCtx=()=>S.plan?`\nLernplan-Ziele: ${(S.plan.ziele||[]).map(z=>z.ziel||z).slice(0,4).join('; ')}`:'';
const pathCtx=()=>S.paths.length?`\nLernpfade (Maßstab sind echte Experten): ${S.paths.map(p=>`${p.titel} → wie ${p.rolle}`).join('; ')}`:'';
const prof=()=>`Nutzer: ${S.set.name}, ${S.set.about}\nZiele: ${S.goals}${pathCtx()}${S.profil?`\nLernerprofil (wie er lernt, Stärken, Schwächen): ${S.profil}`:''}${topErr(5).length?`\nWiederkehrende Fehler: ${topErr(5).map(([k,e])=>`${k} (${e.n}×)`).join('; ')}`:''}${planCtx()}`;

function fixJ(t){let o='',q=false,e=false;for(const ch of t){if(q){if(e){e=false;o+=ch;continue}if(ch==='\\'){e=true;o+=ch;continue}if(ch==='"'){q=false;o+=ch;continue}if(ch==='\n'){o+='\\n';continue}if(ch==='\r')continue;if(ch==='\t'){o+='\\t';continue}o+=ch}else{if(ch==='"')q=true;o+=ch}}return o.replace(/,\s*([}\]])/g,'$1')}
function parseJ(c){c=String(c).replace(/<think>[\s\S]*?<\/think>/g,'').replace(/```(json)?/g,'');const a=c.indexOf('{'),b=c.lastIndexOf('}');if(a<0||b<a)throw new Error('BADJSON');const t=c.slice(a,b+1);try{return JSON.parse(t)}catch(e){try{return JSON.parse(fixJ(t))}catch(e2){throw new Error('BADJSON')}}}
let lastCall=0;
async function ai(sys,msgs,json=true,retry=false){
  const s=S.set;
  if(!s.base||!s.model)throw new Error('API-Adresse und Modell unter Einstellungen eintragen.');
  if(!s.key)throw new Error('Kein API-Key. Unter Einstellungen eintragen (Groq: console.groq.com, Gemini: aistudio.google.com).');
  if(typeof msgs==='string')msgs=[{role:'user',content:msgs}];
  const body={model:s.model,messages:[{role:'system',content:sys},...msgs],temperature:.8};
  if(json)body.response_format={type:'json_object'};
  if((/gpt-oss/.test(s.model)&&/groq/.test(s.base))||/googleapis/.test(s.base))body.reasoning_effort='low';
  if(/googleapis/.test(s.base)){const w=lastCall+7000-Date.now();if(w>0)await sleep(w)}lastCall=Date.now();
  const go=()=>{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),90000);return fetch(s.base.replace(/\/$/,'')+'/chat/completions',{signal:ac.signal,method:'POST',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.key},body:JSON.stringify(body)}).finally(()=>clearTimeout(to))};
  let r;
  for(let tries=0;;tries++){
    try{r=await go()}catch(e){if(e.name==='AbortError'&&tries<1){continue}throw new Error(e.name==='AbortError'?'Die KI hat zu lange nicht geantwortet. Nochmal versuchen oder ein anderes Modell wählen.':'Keine Verbindung zur KI. Internet oder Adresse prüfen.')}
    if(r.status===400&&body.response_format){delete body.response_format;delete body.reasoning_effort;continue}
    if(r.status===429){const t=await r.clone().text();
      if(/PerDay|per day|daily/i.test(t))throw new Error('Tageslimit für dieses Modell erreicht. Ab 9 Uhr geht es wieder, oder unter Einstellungen ein anderes Modell bzw. Groq wählen.');
      if(tries<2){const m=t.match(/retryDelay"?:\s*"?(\d+)/);const ra=+(m&&m[1])||+r.headers.get('retry-after')||15;await sleep(Math.min(60,ra)*1000+500);continue}}
    if([500,502,503,504].includes(r.status)&&tries<2){
      if(/googleapis/.test(s.base)&&body.model!=='gemini-flash-lite-latest')body.model='gemini-flash-lite-latest';
      await sleep([3000,8000][tries]);continue}
    break;
  }
  if(r.status===429)throw new Error('Limit der Gratis-API erreicht. Eine Minute warten und nochmal versuchen.');
  if([500,502,503,504].includes(r.status))throw new Error('Die KI ist gerade überlastet (Fehler '+r.status+'). In ein paar Minuten nochmal versuchen.');
  if(!r.ok)throw new Error('Fehler '+r.status+': '+(await r.text()).slice(0,240));
  const c=(await r.json()).choices?.[0]?.message?.content||'';
  if(!json)return c.replace(/<think>[\s\S]*?<\/think>/g,'').trim();
  try{return parseJ(c)}catch(e){
    if(!retry)return ai(sys,[...msgs,{role:'assistant',content:c.slice(0,2000)},{role:'user',content:'Das war kein gültiges JSON. Gib dieselbe Antwort nochmal, ausschließlich als gültiges JSON ohne Text davor oder danach, kürzer formuliert.'}],true,true);
    throw new Error('Die KI hat eine unlesbare Antwort geliefert. Bitte nochmal versuchen.')}
}

function pickCats(n,exclude=[]){
  const on=DAILY.filter(k=>S.set.cats[k]&&k!=='wort'&&!exclude.includes(k));
  const now=Date.now();
  const sc=k=>{const r=S.res.filter(x=>x.cat===k);const last=r.length?r[r.length-1].t:0;const days=last?(now-last)/864e5:20;const rec=r.slice(-5);const avg=rec.length?rec.reduce((a,b)=>a+b.score,0)/rec.length:5;return (Math.min(days,10)+(10-avg)*.7)*(CATS[k].w||1)+Math.random()*2};
  return on.sort((a,b)=>sc(b)-sc(a)).slice(0,Math.max(0,n));
}

async function maybeCycle(){

/* ================= Coach ================= */
const sysFrage=()=>`Du bist der persönliche Coach von ${S.set.name} für Denken, Mathe, Physik, Mechatronik, Rhetorik, Psychologie, Smalltalk, Sprache und Allgemeinwissen.
${prof()}
Antworte direkt, präzise und tiefgehend, auch mit Profi-Wissen, passend zu seinem Lernerprofil. Keine Floskeln. Kurz, außer er will mehr. Formeln in Klartext (z. B. E = h·f), kein LaTeX.
Wenn er sagt, er hat etwas verstanden, es aber nicht gezeigt hat: Frag freundlich nach ("Sicher? Dann erklär mir kurz …") oder stell eine kurze Verständnis- oder Transferfrage.${S.ctx?`\nEr arbeitet an dieser Trainingsaufgabe: "${S.ctx.titel}": ${S.ctx.aufgabe}\nVor der Abgabe: nur Rückfragen und Denkanstöße (sokratisch), die Lösung nur, wenn er ausdrücklich danach fragt.`:''}`;
const sysTut=()=>{const T=S.tut,P=S.topics[T.topic];return `Du bist ein exzellenter Privatlehrer für ${S.set.name}. Thema: "${T.topic}". ${T.ziel?`Sein Ziel: ${T.ziel}.`:''}
${prof()}${P?`\nLetzter Stand in diesem Thema: Kann: ${P.stand} Lücken: ${P.luecken} Nächster Schritt: ${P.naechster}`:''}
Methode:
1. Zu Beginn kurz das Vorwissen prüfen (1-2 Fragen), dann dort ansetzen.
2. In kleinen Schritten erklären, genau auf sein Profil zugeschnitten. Ist er eher Praktiker: greifbare Beispiele, Experimente, Technik-Analogien, erst Intuition, dann Formel.
3. Nach jedem Schritt eine Verständnisfrage, die Erklären, Anwenden oder Vorhersagen verlangt, nie eine Ja/Nein-Frage.
4. Sagt er "verstanden" oder "ok", ohne es gezeigt zu haben, glaub es nicht einfach: "Sicher? Dann erklär es mir in eigenen Worten" oder eine Transferfrage.
5. Ist die Antwort falsch oder lückenhaft, erkläre es anders (andere Analogie, anderer Zugang), nicht nur länger.
6. Erst weiter, wenn er es nachweislich kann. Typische Missverständnisse und fortgeschrittene Feinheiten aktiv einbauen.
7. Merkst du, welche Erklärweise bei ihm wirkt, nutze mehr davon.
Kurze Nachrichten (max. ca. 150 Wörter), eine Sache pro Nachricht, auf Deutsch, Formeln in Klartext, kein LaTeX.`};
const debSys=()=>`Du bist ein starker, gewiefter Debattengegner. Thema: "${S.deb.thema}". Deine Position: ${S.deb.pos}. Gegenüber: ${S.set.about}
Ziel: Er soll lernen, Kunstgriffe zu erkennen und trotzdem zu gewinnen. Setze in JEDER Antwort 1 bis 2 rhetorische Kunstgriffe, Fehlschlüsse, Manipulations- oder Verhandlungstechniken subtil ein (abwechslungsreich, aus allen Quellen, Schopenhauer nur eine davon), gemischt mit echten guten Argumenten. Benenne sie NICHT. Werde schwerer zu schlagen, je besser er argumentiert. Antworten kurz (2-5 Sätze), wie in einem echten Gespräch, auf Deutsch.
Format: {"antwort":"deine Antwort","kunstgriffe":["Name des verwendeten Kunstgriffs (versteckt)"]}`;
async function coachSend(text){
  if(coachMode==='frage'){
    S.chat.push({role:'user',content:text});save();
    const a=await ai(sysFrage(),S.chat.slice(-14),false);
    S.chat.push({role:'assistant',content:a});save();
  }else if(coachMode==='lernen'){
    const T=S.tut;T.msgs.push({role:'user',content:text});save();
    const a=await ai(sysTut(),T.msgs.slice(-20).map(m=>({role:m.role,content:m.content})),false);
    T.msgs.push({role:'assistant',content:a});save();
  }else{
    const D=S.deb;D.msgs.push({role:'user',content:text});save();
    const a=await ai(debSys(),D.msgs.slice(-16).map(m=>({role:m.role,content:m.content})));
    D.msgs.push({role:'assistant',content:a.antwort||'',k:a.kunstgriffe||[]});save();
  }
}
async function tutStart(topic,ziel){
  S.tut={topic,ziel,msgs:[{role:'user',content:S.topics[topic]?'Wir machen in diesem Thema weiter. Knüpf an meinen letzten Stand an und prüf zuerst kurz, ob ich das Letzte noch kann.':'Starte die Lernsitzung. Prüf zuerst kurz mein Vorwissen.',hide:1}]};
  const a=await ai(sysTut(),S.tut.msgs.map(m=>({role:m.role,content:m.content})),false);
  S.tut.msgs.push({role:'assistant',content:a});save();
}
async function tutEnd(){
  const T=S.tut;
  const tr=T.msgs.filter(m=>!m.hide).map(m=>(m.role==='user'?'SCHÜLER: ':'LEHRER: ')+m.content).join('\n').slice(-9000);
  const j=await ai('Du bist Lehrer und fasst eine Lernsitzung ehrlich zusammen. Nur gültiges JSON auf Deutsch.',`Thema: ${T.topic}\nVerlauf:\n${tr}\n\nFormat: {"stand":"was er nachweislich verstanden hat","luecken":"was noch unsicher ist","naechster":"nächster sinnvoller Schritt","lernstil":"was über seinen Lernstil erkennbar war"}`);
  const o=S.topics[T.topic]||{n:0};
  S.topics[T.topic]={...j,ziel:T.ziel,d:today(),n:(o.n||0)+1};S.tut=null;save();

async function debStart(thema){
  const p=await ai('Antworte ausschließlich mit gültigem JSON auf Deutsch.',`Wähle für ein Debattentraining ${thema?`zum Thema "${thema}"`:'ein kontroverses, alltagsnahes oder gesellschaftliches Thema'} eine klare Streitfrage und eine Position für den KI-Gegner. Format: {"thema":"Streitfrage","pos":"Position der KI","nutzer":"Position des Nutzers"}`);

async function debEnd(){

let sp=null;
function mathQ(){
  const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),t=r(0,4);
  if(t===0){const a=r(12,49),b=r(3,9);return{type:'m',q:`${a} × ${b}`,a:a*b}}
  if(t===1){const p=[5,10,15,20,25,30,40][r(0,6)],v=r(4,40)*10;return{type:'m',q:`${p} % von ${v}`,a:p*v/100}}
  if(t===2){const a=r(120,980),b=r(45,399);return{type:'m',q:`${a} − ${b}`,a:a-b}}
  if(t===3){const b=r(3,12),a=b*r(6,25);return{type:'m',q:`${a} : ${b}`,a:a/b}}
  const a=r(13,19);return{type:'m',q:`${a}²`,a:a*a};
}
function spQueue(){
  const sh=a=>a.sort(()=>Math.random()-.5);
  const due=sh([...sh(S.words.filter(w=>w.due<=today())).slice(0,10).map(w=>({type:'w',w})),...sh(Object.values(S.tech).filter(x=>x.due<=today()&&!x.relearn)).slice(0,6).map(x=>({type:'t',x}))]);
  const q=[];while(q.length<40){if(due.length)q.push(due.shift());q.push(mathQ())}
  return q;
}

  if(a==='wipe'){if(!confirm('Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden.'))return;locked=true;localStorage.removeItem('dt');localStorage.removeItem('dtx');location.reload()}
  const bk={...S,set:{...S.set,key:''}};
  if(a==='exp'){try{await navigator.clipboard.writeText(JSON.stringify(bk));$('bk').textContent='Kopiert (ohne API-Key).'}catch(err){$('imp').value=JSON.stringify(bk);$('bk').textContent='Kopieren ging nicht, Backup steht im Feld.'}}
  if(a==='dl'){const u=URL.createObjectURL(new Blob([JSON.stringify(bk)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='denktraining-'+today()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  if(a==='imp'){try{const d=JSON.parse($('imp').value);if(!d.res||!d.set)throw 0;const key=S.set.key;S=merge(d);if(!S.set.key)S.set.key=key;save();render();$('bk').textContent='Wiederhergestellt.'}catch(err){$('bk').textContent='Ungültiges Backup.'}}
});
render();
if(!locked)maybeCycle();
try{navigator.storage?.persist?.()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
